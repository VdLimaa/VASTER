[project]
name = "vaster"
version = "0.1.0"
description = "Masterset BR — slots de variante de carta Pokémon com status, preço em BRL e export para impressão"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
# A API entra na F2. Declarado aqui para o terreno já estar escolhido.
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "weasyprint>=62"]

[project.scripts]
vaster-ingest = "ingest.__main__:main"

[tool.setuptools]
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
