<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masterset BR — Monte seu fichário</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Mesma identidade do protótipo: a tela é do mesmo produto. */
:root {
  --bg: #f7f6fa; --surface: #fff; --surface-2: #f0eef6; --line: #e2dded;
  --fg: #1b1726; --fg-dim: #554e68; --fg-mute: #8a82a0;
  --accent: #5b3fd6; --accent-soft: #ece7ff;
  --ok: #10745a; --ok-soft: #dcf2ea; --wait: #8a5a00; --wait-soft: #fbeed3;
  --gem: #b82b45; --gem-soft: #fbe4e8;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Public Sans", ui-sans-serif, system-ui, sans-serif;
  --data: "JetBrains Mono", ui-monospace, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121018; --surface: #1b1824; --surface-2: #241f31; --line: #342e46;
  --fg: #edeaf5; --fg-dim: #b5adc8; --fg-mute: #7e7592;
  --accent: #a98fff; --accent-soft: #2b2246;
  --ok: #55d3a4; --ok-soft: #10352a; --wait: #e3b55c; --wait-soft: #392b10;
  --gem: #ff7287; --gem-soft: #3a1620; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121018; --surface: #1b1824; --surface-2: #241f31; --line: #342e46;
  --fg: #edeaf5; --fg-dim: #b5adc8; --fg-mute: #7e7592;
  --accent: #a98fff; --accent-soft: #2b2246;
  --ok: #55d3a4; --ok-soft: #10352a; --wait: #e3b55c; --wait-soft: #392b10;
  --gem: #ff7287; --gem-soft: #3a1620; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body);
       font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }

.topo { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 5vw, 34px);
     margin: 0; letter-spacing: -.02em; }
.sub { color: var(--fg-mute); font-size: 13px; margin: 0 0 20px; }

/* --- filtros --- */
.filtros { background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 14px; display: flex;
           flex-direction: column; gap: 12px; }
.grupo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.rotulo { font-family: var(--data); font-size: 10px; letter-spacing: .12em;
          text-transform: uppercase; color: var(--fg-mute); width: 68px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
        font-weight: 500; padding: 6px 11px; border-radius: 999px; cursor: pointer;
        background: var(--surface-2); color: var(--fg-dim); border: 1px solid var(--line);
        transition: background .12s, border-color .12s, color .12s; }
.chip:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg);
        border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .n { font-family: var(--data); font-size: 11px; color: var(--fg-mute); }
input[type="search"] { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
        min-width: 0; flex: 1 1 220px; }
input[type="search"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* --- lista de coleções --- */
.colecoes { margin-top: 10px; max-height: 320px; overflow-y: auto;
            border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.colecao { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
           width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
           background: transparent; border: 0; border-bottom: 1px solid var(--line);
           padding: 9px 12px; }
.colecao:last-child { border-bottom: 0; }
.colecao:hover { background: var(--surface); }
.colecao[aria-pressed="true"] { background: var(--accent-soft); }
.colecao .nome { font-weight: 500; }
.colecao .meta { font-size: 12px; color: var(--fg-mute); }
.colecao .cnt { font-family: var(--data); font-size: 12px; color: var(--fg-mute);
                white-space: nowrap; }

/* --- painel + fichário --- */
.palco { display: grid; grid-template-columns: 1fr 268px; gap: 20px; margin-top: 22px;
         align-items: start; }
.resumo { position: sticky; top: 16px; background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column;
          gap: 12px; }
.barra { height: 7px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; }
.pct { font-family: var(--display); font-weight: 800; font-size: 26px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--surface-2); border-radius: 8px; padding: 8px 9px; }
.tile b { display: block; font-family: var(--data); font-size: 17px; }
.tile span { font-size: 10.5px; color: var(--fg-mute); letter-spacing: .04em;
             text-transform: uppercase; }
.tile.ok b { color: var(--ok); } .tile.wait b { color: var(--wait); }

.pagina { background: var(--surface); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px; }
.grade { display: grid; gap: 10px; }
.slot { position: relative; display: flex; flex-direction: column; gap: 6px;
        background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
        padding: 7px; }
.slot .arte { position: relative; aspect-ratio: 734 / 1024; border-radius: 5px;
              overflow: hidden; background: var(--bg); }
.slot .arte img { width: 100%; height: 100%; object-fit: cover; display: block;
                  filter: grayscale(1) opacity(.42); transition: filter .15s; }
.slot[data-estado="owned"] .arte img { filter: none; }
.slot[data-estado="wanted"] .arte img { filter: grayscale(.45) opacity(.82); }
.slot .vazio { display: grid; place-items: center; height: 100%; color: var(--fg-mute);
               font-family: var(--data); font-size: 10px; text-align: center; padding: 6px; }
.slot .cabeca { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.slot .num { font-family: var(--data); font-size: 11px; color: var(--fg-dim); }
.slot .nome { font-size: 12.5px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.25; }
.slot .marcas { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-family: var(--data); font-size: 9.5px; letter-spacing: .04em; padding: 1px 5px;
       border-radius: 4px; background: var(--bg); color: var(--fg-mute);
       border: 1px solid var(--line); white-space: nowrap; }
.tag.rf { background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 75%, var(--fg));
          border-color: transparent; }
.tag.esp { background: var(--gem-soft); color: var(--gem); border-color: transparent; }
.tag.inf { background: var(--wait-soft); color: var(--wait); border-color: transparent; }
.acoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.acoes button { font: inherit; font-size: 10.5px; font-weight: 600; padding: 5px 2px;
        border-radius: 6px; cursor: pointer; border: 1px solid var(--line);
        background: var(--bg); color: var(--fg-mute); }
.acoes button:hover { border-color: var(--accent); color: var(--fg); }
.slot[data-estado="owned"] .acoes .b-ok { background: var(--ok-soft); color: var(--ok);
        border-color: transparent; }
.slot[data-estado="wanted"] .acoes .b-want { background: var(--wait-soft); color: var(--wait);
        border-color: transparent; }
.slot:not([data-estado]) .acoes .b-no,
.slot[data-estado=""] .acoes .b-no { background: var(--surface-2); color: var(--fg-dim); }

.paginacao { display: flex; align-items: center; justify-content: center; gap: 14px;
             margin-top: 14px; }
.paginacao button { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px;
        cursor: pointer; background: var(--surface-2); color: var(--fg-dim);
        border: 1px solid var(--line); }
.paginacao button:disabled { opacity: .4; cursor: default; }
.paginacao span { font-family: var(--data); font-size: 12px; color: var(--fg-mute); }

.vaziao { text-align: center; padding: 48px 20px; color: var(--fg-dim);
          border: 1px dashed var(--line); border-radius: var(--radius); }
.vaziao strong { display: block; font-family: var(--display); font-size: 18px;
                 color: var(--fg); margin-bottom: 6px; }
.rodape { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line);
          color: var(--fg-mute); font-size: 12.5px; }
.rodape code { font-family: var(--data); font-size: 11.5px; background: var(--surface-2);
               padding: 1px 5px; border-radius: 4px; }
@media (max-width: 880px) {
  .palco { grid-template-columns: 1fr; }
  .resumo { position: static; order: -1; }
  .rotulo { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <h1>Monte seu fichário</h1>
  </div>
  <p class="sub">Sem login — o que você marca fica salvo neste aparelho.
     <span id="saude"></span></p>

  <div class="filtros">
    <div class="grupo" id="g-idioma"><span class="rotulo">Idioma</span></div>
    <div class="grupo" id="g-regiao"><span class="rotulo">Região</span></div>
    <div class="grupo" id="g-tipo"><span class="rotulo">Tipo</span></div>
    <div class="grupo">
      <span class="rotulo">Coleção</span>
      <input type="search" id="busca" placeholder="Buscar coleção (ex: 151, Céus em Evolução…)"
             autocomplete="off">
      <button class="chip" type="button" id="limpar">Limpar recorte</button>
    </div>
    <div class="colecoes" id="colecoes"></div>
  </div>

  <div class="palco">
    <div id="fichario"></div>
    <aside class="resumo" id="resumo"></aside>
  </div>

  <div class="rodape">
    <p>Dado do seu Postgres, servido por <code>uvicorn api.main:app</code>. As imagens
       vêm por hotlink do CDN do TCGdex — nenhuma carta é rehospedada.</p>
  </div>
</div>

<script>
const API = "";
const CHAVE = "vaster.binder.v1";
const ROTULO_TIPO = { regular: "Normal", reverse_holo: "RF", holo: "Holo",
  alt_art: "Arte", full_art: "Full Art", rainbow: "Rainbow", gold: "Gold",
  shiny: "Shiny", promo: "Promo", first_edition: "1ª ed" };
const ESPECIAIS = new Set(["alt_art", "full_art", "rainbow", "gold", "shiny"]);
const POR_PAGINA = 9;

const estado = {
  idioma: "pt", regiao: null, tipo: null, colecao: null,
  pagina: 0, slots: [], resumo: null, colecoes: [],
};
let marcas = carregar();

function carregar() {
  try { return JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch { return {}; }
}
function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(marcas)); } catch { /* aba privada */ }
}
function esc(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function leve(url) { return url ? url.replace(/\/high\.png$/, "/low.webp") : null; }

async function pegar(rota) {
  const r = await fetch(API + rota);
  if (!r.ok) throw new Error(`${r.status} em ${rota}`);
  return r.json();
}

function chips(alvo, itens, atual, aoEscolher, { comNulo, rotuloNulo } = {}) {
  const el = document.getElementById(alvo);
  el.querySelectorAll(".chip").forEach((c) => c.remove());
  const criar = (valor, nome, n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(valor === atual));
    b.innerHTML = esc(nome) + (n != null ? ` <span class="n">${n}</span>` : "");
    b.onclick = () => aoEscolher(valor === atual && comNulo ? null : valor);
    el.appendChild(b);
  };
  if (comNulo) criar(null, rotuloNulo || "Todas");
  itens.forEach((i) => criar(i.valor, i.nome, i.slots ?? null));
}

async function montarFiltros() {
  const [idiomas, regioes] = await Promise.all([
    pegar("/api/idiomas"), pegar("/api/regioes"),
  ]);
  chips("g-idioma", idiomas, estado.idioma, (v) => {
    if (!v) return;
    estado.idioma = v; estado.pagina = 0;
    montarFiltros(); carregarColecoes(); carregarBinder();
  });
  chips("g-regiao", regioes.map((r) => ({ ...r, slots: r.especies })), estado.regiao,
    (v) => { estado.regiao = v; estado.pagina = 0; carregarColecoes(); carregarBinder(); },
    { comNulo: true, rotuloNulo: "Todas as regiões" });
  const tipos = await pegar("/api/tipos" + (estado.colecao ? `?colecao=${estado.colecao}` : ""));
  chips("g-tipo", tipos, estado.tipo,
    (v) => { estado.tipo = v; estado.pagina = 0; carregarBinder(); },
    { comNulo: true, rotuloNulo: "Todos os tipos" });
}

async function carregarColecoes() {
  const p = new URLSearchParams({ idioma: estado.idioma });
  if (estado.regiao) p.set("regiao", estado.regiao);
  const busca = document.getElementById("busca").value.trim();
  if (busca) p.set("busca", busca);
  estado.colecoes = await pegar("/api/colecoes?" + p);
  const el = document.getElementById("colecoes");
  if (!estado.colecoes.length) {
    el.innerHTML = '<div style="padding:14px;color:var(--fg-mute)">Nenhuma coleção nesse recorte.</div>';
    return;
  }
  el.innerHTML = estado.colecoes.slice(0, 200).map((c) => `
    <button class="colecao" type="button" data-set="${esc(c.set_id)}"
            aria-pressed="${c.set_id === estado.colecao}">
      <span>
        <span class="nome">${esc(c.set_name)}</span><br>
        <span class="meta">${esc(c.serie_name || "")}${c.set_release ? " · " + c.set_release.slice(0, 4) : ""} · ${esc(c.set_id)}</span>
      </span>
      <span class="cnt">${c.slots} slots<br>${c.cartas} cartas</span>
    </button>`).join("");
  el.querySelectorAll(".colecao").forEach((b) => {
    b.onclick = () => {
      estado.colecao = b.dataset.set === estado.colecao ? null : b.dataset.set;
      estado.pagina = 0;
      carregarColecoes(); montarFiltros(); carregarBinder();
    };
  });
}

async function carregarBinder() {
  const alvo = document.getElementById("fichario");
  const painel = document.getElementById("resumo");
  if (!estado.colecao && !estado.regiao) {
    alvo.innerHTML = `<div class="vaziao"><strong>Escolha um recorte</strong>
      Uma coleção, uma região, ou os dois — por exemplo Kanto dentro da coleção 151.</div>`;
    painel.innerHTML = "";
    return;
  }
  alvo.innerHTML = '<div class="vaziao">Carregando…</div>';
  const p = new URLSearchParams({ idioma: estado.idioma });
  if (estado.colecao) p.set("colecao", estado.colecao);
  if (estado.regiao) p.set("regiao", estado.regiao);
  if (estado.tipo) p.set("tipo", estado.tipo);
  let d;
  try { d = await pegar("/api/binder?" + p); }
  catch (e) {
    alvo.innerHTML = `<div class="vaziao"><strong>Não deu</strong>${esc(e.message)}</div>`;
    return;
  }
  estado.slots = d.slots; estado.resumo = d.resumo;
  if (estado.pagina * POR_PAGINA >= estado.slots.length) estado.pagina = 0;
  pintar();
}

function marcar(id, valor) {
  if (marcas[id] === valor) delete marcas[id]; else marcas[id] = valor;
  salvar(); pintar();
}

function pintar() {
  const slots = estado.slots;
  const total = slots.length;
  const tenho = slots.filter((s) => marcas[s.variant_id] === "owned").length;
  const quero = slots.filter((s) => marcas[s.variant_id] === "wanted").length;
  const pct = total ? Math.round((100 * tenho) / total) : 0;

  document.getElementById("resumo").innerHTML = `
    <div>
      <div class="pct">${pct}%</div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div style="font-size:12.5px;color:var(--fg-mute);margin-top:6px">
        ${tenho} de ${total} slots${estado.resumo ? " · " + estado.resumo.cartas + " cartas" : ""}
      </div>
    </div>
    <div class="tiles">
      <div class="tile ok"><b>${tenho}</b><span>Tenho</span></div>
      <div class="tile wait"><b>${quero}</b><span>Quero</span></div>
      <div class="tile"><b>${total - tenho}</b><span>Falta</span></div>
    </div>
    ${estado.resumo ? `<div style="font-size:12px;color:var(--fg-mute);line-height:1.7">
      ${estado.resumo.confirmados} confirmados pelo catálogo<br>
      ${estado.resumo.inferidos ? estado.resumo.inferidos + " inferidos por regra de era<br>" : ""}
      ${estado.resumo.sem_foto ? estado.resumo.sem_foto + " sem foto<br>" : ""}
      ${estado.resumo.fora_do_catalogo ? estado.resumo.fora_do_catalogo + " fora do catálogo" : ""}
    </div>` : ""}`;

  const alvo = document.getElementById("fichario");
  if (!total) {
    alvo.innerHTML = `<div class="vaziao"><strong>Nenhum slot nesse recorte</strong>
      Afrouxe o tipo ou troque o idioma.</div>`;
    return;
  }
  const paginas = Math.ceil(total / POR_PAGINA);
  const inicio = estado.pagina * POR_PAGINA;
  const folha = slots.slice(inicio, inicio + POR_PAGINA);

  alvo.innerHTML = `
    <div class="pagina">
      <div class="grade" style="grid-template-columns:repeat(3,1fr)">
        ${folha.map((s) => cartao(s)).join("")}
      </div>
    </div>
    <div class="paginacao">
      <button type="button" id="ant" ${estado.pagina === 0 ? "disabled" : ""}>← Anterior</button>
      <span>Página ${estado.pagina + 1} de ${paginas}</span>
      <button type="button" id="prox" ${estado.pagina + 1 >= paginas ? "disabled" : ""}>Próxima →</button>
    </div>`;

  alvo.querySelectorAll("[data-marca]").forEach((b) => {
    b.onclick = () => marcar(b.dataset.id, b.dataset.marca);
  });
  const ant = document.getElementById("ant"), prox = document.getElementById("prox");
  if (ant) ant.onclick = () => { estado.pagina--; pintar(); window.scrollTo({ top: 0, behavior: "smooth" }); };
  if (prox) prox.onclick = () => { estado.pagina++; pintar(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

function cartao(s) {
  const marca = marcas[s.variant_id] || "";
  const img = leve(s.image_url);
  const classeTag = s.kind === "reverse_holo" ? "tag rf" : ESPECIAIS.has(s.kind) ? "tag esp" : "tag";
  const numero = s.set_count_official
    ? String(s.number).padStart(String(s.set_count_official).length, "0") + "/" + s.set_count_official
    : s.number;
  return `
    <div class="slot" data-estado="${marca}">
      <div class="arte">${img
        ? `<img src="${esc(img)}" alt="" loading="lazy">`
        : `<div class="vazio">sem foto${s.no_catalogo ? "" : "<br>fora do catálogo"}</div>`}</div>
      <div class="cabeca">
        <span class="num">${esc(numero)}</span>
      </div>
      <div class="nome">${esc(s.card_name)}</div>
      <div class="marcas">
        <span class="${classeTag}">${esc(ROTULO_TIPO[s.kind] || s.kind)}</span>
        ${s.created_by === "inferred" ? '<span class="tag inf">inferido</span>' : ""}
      </div>
      <div class="acoes">
        <button type="button" class="b-ok"   data-marca="owned"  data-id="${s.variant_id}">Tenho</button>
        <button type="button" class="b-want" data-marca="wanted" data-id="${s.variant_id}">Quero</button>
        <button type="button" class="b-no"   data-marca=""       data-id="${s.variant_id}">Falta</button>
      </div>
    </div>`;
}

let tempo;
document.getElementById("busca").addEventListener("input", () => {
  clearTimeout(tempo); tempo = setTimeout(carregarColecoes, 220);
});
document.getElementById("limpar").onclick = () => {
  estado.regiao = null; estado.tipo = null; estado.colecao = null; estado.pagina = 0;
  document.getElementById("busca").value = "";
  montarFiltros(); carregarColecoes(); carregarBinder();
};

(async function iniciar() {
  try {
    const s = await pegar("/api/saude");
    document.getElementById("saude").textContent =
      `· ${s.slots.toLocaleString("pt-BR")} slots em ${s.colecoes} coleções`;
  } catch { /* segue sem o cabeçalho */ }
  await montarFiltros();
  await carregarColecoes();
  await carregarBinder();
})();
</script>
</body>
</html>
