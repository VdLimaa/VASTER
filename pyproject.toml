# Declarado na mão: a partir do Python 3.12 o venv não traz mais setuptools, e
# sem este bloco o pip tem que adivinhar o backend de build. Em máquina limpa,
# adivinhar é o que falha.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaster"
version = "0.1.0"
description = "Masterset BR — slots de variante de carta Pokémon com status, preço em BRL e export para impressão"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1"]
# O PDF da F2. Fica num extra próprio porque o WeasyPrint precisa do GTK
# instalado à parte no Windows, e quem só quer a tela não paga por isso.
pdf = ["weasyprint>=62"]


[project.scripts]
vaster-ingest = "ingest.__main__:main"

[tool.setuptools]
packages = ["ingest", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
